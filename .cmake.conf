# Tracks the Qt release this module is built with, as in every Qt repo. The Qt
# build system derives the Qt6:: target namespace, the soname and the
# private-header directory from it, so its major version has to be Qt's.
set(QT_REPO_MODULE_VERSION "6.12.0")
# The extension's own release version, which the documentation advertises.
set(QT_ROS2_VERSION "0.1.0")
# The oldest Qt this module builds against, which is a separate matter.
set(QT_ROS2_MIN_QT_VERSION "6.8")
set(APPEND QT_EXTRA_INTERNAL_TARGET_DEFINES
    "QT_NO_CONTEXTLESS_CONNECT=1"
    "QT_NO_FOREACH=1"
    "QT_NO_QASCONST=1"
    "QT_NO_QSNPRINTF=1"
    "QT_NO_URL_CAST_FROM_STRING=1"
)
