# Tracks the Qt release this module is built with, as in every Qt repo: it
# tags the docs, the soname and the private-header directory.
set(QT_REPO_MODULE_VERSION "6.12.0")
# The oldest Qt this module builds against, which is a separate matter.
set(QT_ROS2_MIN_QT_VERSION "6.8")
set(QT_REPO_MODULE_PRERELEASE_VERSION_SEGMENT "alpha1")
set(APPEND QT_EXTRA_INTERNAL_TARGET_DEFINES
    "QT_NO_CONTEXTLESS_CONNECT=1"
    "QT_NO_FOREACH=1"
    "QT_NO_QASCONST=1"
    "QT_NO_QSNPRINTF=1"
    "QT_NO_URL_CAST_FROM_STRING=1"
)
