<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"
     width="160" height="160" role="img" aria-label="Experimental Extension">
  <title>Experimental Extension</title>

  <!-- hazard triangle -->
  <path d="M80 12 L153 143 a9 9 0 0 1 -8 13 L15 156 a9 9 0 0 1 -8 -13 Z"
        fill="#FFC93C" stroke="#1B1B1B" stroke-width="9" stroke-linejoin="round"/>

  <!-- test tube, tilted -->
  <g transform="rotate(16 80 96)">
    <!-- glass -->
    <path d="M69 62 V116 a11 11 0 0 0 22 0 V62"
          fill="#FFFFFF" stroke="#1B1B1B" stroke-width="7"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- liquid -->
    <path d="M69 96 V116 a11 11 0 0 0 22 0 V96 Z" fill="#41CD52"/>
    <!-- rim -->
    <rect x="63" y="52" width="34" height="10" rx="5"
          fill="#1B1B1B"/>
    <!-- bubbles -->
    <circle cx="77" cy="104" r="3.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="85" cy="111" r="2.4" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
