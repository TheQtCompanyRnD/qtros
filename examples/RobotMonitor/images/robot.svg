<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- robot head 40x40, using #2BA3B4 -->
  <g fill="#2BA3B4" stroke="#2BA3B4" stroke-width="1.4" stroke-linejoin="round">
    <!-- head with ~4px margin -->
    <rect x="5" y="9" width="30" height="20" rx="4" ry="4" fill="none"/>
    <!-- eyes -->
    <circle cx="15" cy="18" r="2" fill="#2BA3B4" stroke="none"/>
    <circle cx="25" cy="18" r="2" fill="#2BA3B4" stroke="none"/>
    <!-- mouth -->
    <rect x="14" y="23" width="12" height="2.4" fill="#2BA3B4" stroke="none"/>
    <!-- antenna -->
    <line x1="20" y1="9" x2="20" y2="4" stroke="#2BA3B4" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="20" cy="3" r="1.7" fill="#2BA3B4" stroke="none"/>
  </g>
</svg>
